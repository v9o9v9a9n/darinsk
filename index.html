<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Посёлок Дарьинское</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #f4f6f9; color: #333; padding-bottom: 30px; }
        
        header { background: #fff; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.05); padding: 12px; }
        .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .title-site { font-size: 18px; font-weight: bold; color: #222; }
        
        .search-row { display: flex; gap: 8px; margin-bottom: 10px; }
        input#searchInput { flex: 1; padding: 12px 15px; border: 2px solid #007bff; border-radius: 8px; outline: none; font-size: 16px; background: #fff; }
        .btn-reset { background: #dc3545; color: #fff; border: none; border-radius: 8px; padding: 0 15px; font-size: 15px; font-weight: bold; cursor: pointer; }
        
        .btn-action-main { display: block; width: 100%; background: #007bff; color: #fff; border: none; border-radius: 8px; padding: 12px; font-size: 15px; font-weight: 500; text-align: center; cursor: pointer; margin-bottom: 12px; box-shadow: 0 2px 4px rgba(0,123,255,0.3); }

        .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .tabs::-webkit-scrollbar { display: none; }
        .tab { padding: 8px 14px; border-radius: 20px; background: #e4e6eb; font-size: 13px; font-weight: bold; cursor: pointer; border: none; white-space: nowrap; color: #444; }
        .tab.active { background: #007bff; color: #fff; }

        .lang-panel { display: flex; gap: 5px; background: #eee; padding: 3px; border-radius: 6px; }
        .lang-btn { padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .lang-btn.active { background: #007bff; color: #fff; }

        #content { padding: 12px; display: flex; flex-direction: column; gap: 12px; }
        
        /* Дизайн карточек из первых двух вариантов */
        .card { background: #fff; border-radius: 12px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; flex-direction: column; gap: 6px; border: 1px solid #eef2f5; }
        .card-tag { display: inline-block; self-content: flex-start; background: #e1f5fe; color: #0288d1; font-size: 11px; font-weight: bold; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; width: max-content; }
        .card-title { font-size: 17px; font-weight: bold; color: #111; margin-top: 2px; }
        .card-desc { font-size: 14px; color: #666; line-height: 1.4; }
        .card-phone-line { font-size: 13px; color: #555; background: #f8f9fa; padding: 6px 10px; border-radius: 6px; border-left: 3px solid #ccc; font-family: monospace; font-weight: bold; margin-top: 2px; }

        /* Компактные кнопки со сплошной заливкой */
        .card-actions { display: flex; gap: 8px; margin-top: 6px; }
        .btn-ui { flex: 1; padding: 10px; border-radius: 6px; border: none; font-size: 14px; font-weight: bold; color: #fff; cursor: pointer; text-align: center; text-decoration: none; }
        .btn-ui-call { background: #2979ff; }
        .btn-ui-wa { background: #1cc88a; }
        .btn-ui-err { width: 42px; flex: none; background: #e74a3b; display: flex; align-items: center; justify-content: center; font-size: 16px; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: #fff; border-radius: 12px; padding: 20px; width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; }
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        .form-group input, .form-group textarea { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
    </style>
</head>
<body>

    <header>
        <div class="top-row">
            <div class="title-site">Посёлок Дарьинское</div>
            <div class="lang-panel">
                <span class="lang-btn active" id="btn-ru" onclick="setLang('ru')">RU</span>
                <span class="lang-btn" id="btn-kz" onclick="setLang('kz')">KZ</span>
            </div>
        </div>
        
        <div class="search-row">
            <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Поиск...">
            <button class="btn-reset" onclick="resetSearch()">Сбросить</button>
        </div>

        <button class="btn-action-main" onclick="openModal('addModal')">➕ Добавить контакт / Нашли ошибку?</button>

        <div class="tabs" id="tabsContainer">
            <!-- Категории будут генерироваться автоматически из базы без вкладки Все -->
        </div>
    </header>

    <main id="content">
        <!-- Сюда скрипт выводит карточки -->
    </main>

    <!-- Модальное окно добавления -->
    <div class="modal" id="addModal" onclick="closeModal('addModal', event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 style="margin-bottom:5px;">Новая анкета</h3>
            <div class="form-group"><input type="text" id="formCat" placeholder="Категория"></div>
            <div class="form-group"><input type="text" id="formPhone" placeholder="Телефон"></div>
            <div class="form-group"><input type="text" id="formName" placeholder="Имя Фамилия"></div>
            <div class="form-group"><textarea id="formDesc" rows="3" placeholder="Описание"></textarea></div>
            <div class="form-group"><input type="text" id="formLoc" placeholder="Ориентир"></input></div>
            <div class="form-group"><input type="text" id="formLink" placeholder="Ссылка (необязательно)"></input></div>
            <button class="btn-ui btn-ui-call" style="width:100%; margin-top:5px;" onclick="sendNewContact()">Отправить в WhatsApp</button>
        </div>
    </div>
        <script>
        const adminPhone = "77058036617";
        let currentLang = 'ru';
        let activeCategory = '';
        let allContacts = [];

        function normalizeString(str) {
            if (!str) return '';
            return str.toLowerCase().replace(/i/g, 'ы').replace(/ё/g, 'е').replace(/[^a-zа-яәғқңөұүһі0-9]/g, '');
        }

        // Парсер под ваши форматы
        function parseDatabase(text) {
            const lines = text.split('\n');
            const parsed = [];
            lines.forEach((line) => {
                const trimmed = line.trim();
                if (!trimmed || trimmed.startsWith('#')) return;

                const cells = trimmed.split('|').map(c => c.trim());
                if (cells.length >= 6) {
                    parsed.push({
                        category: cells[0] || 'РАЗНОЕ',
                        title: cells[3] || 'Без названия',
                        name: cells[2] || '',
                        phone: cells[1] || '',
                        landmark: cells[4] || '',
                        link: cells[5] || ''
                    });
                } else if (cells.length === 5) {
                    parsed.push({
                        category: cells[0] || 'ЖИТЕЛИ',
                        title: cells[1] || 'Житель',
                        name: cells[2] || '',
                        phone: cells[4] || '',
                        landmark: cells[3] || '',
                        link: ''
                    });
                }
            });
            return parsed;
        }

        async function loadData() {
            try {
                const response = await fetch('baza.txt');
                const text = await response.text();
                allContacts = parseDatabase(text);
                
                // Извлекаем уникальные категории для вкладок
                const categories = [...new Set(allContacts.map(item => item.category.toUpperCase()))];
                if (categories.length > 0) activeCategory = categories[0];
                
                renderTabs(categories);
                renderCards();
            } catch (err) {
                alert("Не удалось загрузить базу контактов (baza.txt)");
            }
        }

        function renderTabs(categories) {
            const container = document.getElementById('tabsContainer');
            container.innerHTML = '';
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `tab ${cat === activeCategory ? 'active' : ''}`;
                btn.innerText = cat;
                btn.onclick = () => {
                    activeCategory = cat;
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    btn.classList.add('active');
                    renderCards();
                };
                container.appendChild(btn);
            });
        }

        // Принудительное открытие WhatsApp через JS для обхода блокировок мобильных браузеров
        function openWhatsApp(phone, message = "") {
            const cleanPhone = phone.replace(/[^0-9]/g, '');
            const url = `https://whatsapp.com{cleanPhone}&text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        }

        function makeCall(phone) {
            const cleanPhone = phone.replace(/[^0-9]/g, '');
            window.location.href = `tel:${cleanPhone}`;
        }

        function reportError(item) {
            const msg = `Найдена ошибка в контакте:\nКатегория: ${item.category}\nНазвание: ${item.title}\nТелефон: ${item.phone}\n\nОпишите, что не так: `;
            openWhatsApp(adminPhone, msg);
        }

        function renderCards() {
            const container = document.getElementById('content');
            container.innerHTML = '';
            const query = normalizeString(document.getElementById('searchInput').value);

            const filtered = allContacts.filter(item => {
                if (item.category.toUpperCase() !== activeCategory) return false;
                if (query) {
                    const pool = normalizeString(item.category + item.title + item.name + item.phone + item.landmark);
                    if (!pool.includes(query)) return false;
                }
                return true;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:20px; color:#999;">Ничего не найдено</div>`;
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                
                card.innerHTML = `
                    <span class="card-tag">${item.category}</span>
                    <div class="card-title">${item.title}</div>
                    <div class="card-desc">${item.name} ${item.landmark ? `• ${item.landmark}` : ''}</div>
                    <div class="card-phone-line">📱 ${item.phone}</div>
                    <div class="card-actions">
                        <button class="btn-ui btn-ui-call" onclick="makeCall('${item.phone}')">Позвонить</button>
                        <button class="btn-ui btn-ui-wa" onclick="openWhatsApp('${item.phone}')">WhatsApp</button>
                        <button class="btn-ui btn-ui-err" title="Сообщить об ошибке">⚠️</button>
                    </div>
                `;
                
                card.querySelector('.btn-ui-err').onclick = () => reportError(item);
                container.appendChild(card);
            });
        }

        function handleSearch() { renderCards(); }
        
        function resetSearch() {
            document.getElementById('searchInput').value = '';
            renderCards();
        }

        function setLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${lang}`).classList.add('active');
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id, event) {
            if (event ? event.target.id === id : true) document.getElementById(id).style.display = 'none';
        }

        function sendNewContact() {
            const cat = document.getElementById('formCat').value.trim();
            const phone = document.getElementById('formPhone').value.trim();
            const name = document.getElementById('formName').value.trim();
            const desc = document.getElementById('formDesc').value.trim();
            const loc = document.getElementById('formLoc').value.trim();
            const link = document.getElementById('formLink').value.trim();

            if (!cat || !phone || !name) { alert('Заполните обязательные поля'); return; }

            const textStr = `${cat} | ${phone} | ${name} | ${desc} | ${loc} | ${link} | $`;
            openWhatsApp(adminPhone, `Прошу добавить контакт:\n\n${textStr}`);
            closeModal('addModal');
        }

        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
